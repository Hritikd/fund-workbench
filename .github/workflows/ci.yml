name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Exercise CLI demo
        run: uv run fund-workbench demo --output /tmp/fund-workbench-demo
